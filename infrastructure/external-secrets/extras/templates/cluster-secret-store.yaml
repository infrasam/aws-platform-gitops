# SSM Parameter Store of this cluster's environment, available to every namespace
# The node's IAM role only allows reading parameters under the path Terraform hands over
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-parameter-store
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    aws:
      service: ParameterStore
      region: {{ required "bridge.awsRegion is required" .Values.bridge.awsRegion }}
      # ExternalSecrets use keys relative to this path, so the same manifests work in every environment
      prefix: {{ required "bridge.ssmParameterPrefix is required" .Values.bridge.ssmParameterPrefix }}/
