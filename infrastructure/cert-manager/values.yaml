# Install the CRDs together with the chart
crds:
  enabled: true

# Internal certificate authority for the platform, created after cert-manager is running
extraObjects:
  # Self-signed issuer, only used to create the root CA below
  - |
    apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: selfsigned
      annotations:
        argocd.argoproj.io/sync-wave: "1"
        argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    spec:
      selfSigned: {}
  # Root CA of the platform, stored in the Secret platform-root-ca
  - |
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: platform-root-ca
      namespace: {{ .Release.Namespace }}
      annotations:
        argocd.argoproj.io/sync-wave: "1"
        argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    spec:
      isCA: true
      commonName: platform-root-ca
      secretName: platform-root-ca
      duration: 87600h
      privateKey:
        algorithm: ECDSA
        size: 256
      issuerRef:
        group: cert-manager.io
        kind: ClusterIssuer
        name: selfsigned
  # Issues certificates for every service on the platform, signed by the root CA
  - |
    apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: platform-ca
      annotations:
        argocd.argoproj.io/sync-wave: "2"
        argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    spec:
      ca:
        secretName: platform-root-ca
