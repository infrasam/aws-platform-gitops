# One Application per component listed for the cluster's environment
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infrastructure
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          # Every cluster registered in Argo CD, labels come from Terraform
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
          # Every component file for that cluster's environment
          - git:
              repoURL: https://github.com/infrasam/aws-platform-gitops.git
              revision: main
              files:
                - path: "environments/{{ .metadata.labels.environment }}/infrastructure/*.yaml"
  template:
    metadata:
      name: "{{ .component.name }}"
    spec:
      project: default
      # Sources are set in templatePatch, so the extras chart can be added per component
      sources: []
      destination:
        name: "{{ .name }}"
        namespace: "{{ .component.namespace }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
  templatePatch: |
    spec:
      sources:
        # The upstream Helm chart, version pinned per environment
        - repoURL: "{{ .component.repoURL }}"
          chart: "{{ .component.chart }}"
          targetRevision: "{{ .component.version }}"
          helm:
            # Environment files are optional, most components only need the shared values
            ignoreMissingValueFiles: true
            valueFiles:
              # Shared settings for every environment
              - "$values/infrastructure/{{ .component.name }}/values.yaml"
              # Environment overrides, applied last so they win
              - "$values/environments/{{ .metadata.labels.environment }}/infrastructure/values/{{ .component.name }}.yaml"
        # This repository, referenced as $values
        - repoURL: https://github.com/infrasam/aws-platform-gitops.git
          targetRevision: main
          ref: values
      {{- if dig "extras" false .component }}
        # Our own chart with related objects (issuers, secrets, dashboards), enabled with extras: true
        - repoURL: https://github.com/infrasam/aws-platform-gitops.git
          targetRevision: main
          path: "infrastructure/{{ .component.name }}/extras"
          helm:
            ignoreMissingValueFiles: true
            valueFiles:
              # Environment overrides for the extras chart, its own values.yaml is the default
              - "$values/environments/{{ .metadata.labels.environment }}/infrastructure/values/{{ .component.name }}-extras.yaml"
            # GitOps Bridge: infrastructure facts from the cluster Secret written by Terraform
            valuesObject:
              bridge:
                clusterName: "{{ .metadata.annotations.cluster_name }}"
                awsRegion: "{{ .metadata.annotations.aws_region }}"
                awsVpcId: "{{ .metadata.annotations.aws_vpc_id }}"
                ssmParameterPrefix: "{{ .metadata.annotations.ssm_parameter_prefix }}"
      {{- end }}
